name: Update Visitor Stats

# Daily: read the cumulative numbers on the public mapmyvisitors page,
# write _data/visitors.json, commit it, then trigger a Pages rebuild
# (pushes made with GITHUB_TOKEN do not trigger other workflows,
#  but workflow_dispatch is allowed).

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *' # UTC 22:30, half an hour after the Scholar job

permissions:
  contents: write
  actions: write

jobs:
  update-visitors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch visitor stats
        run: python3 visitor_stats/fetch_visitors.py

      - name: Commit, push and rebuild site if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/visitors.json
          if git diff --staged --quiet; then
            echo "No change in visitor stats."
            exit 0
          fi
          git commit -m "🌍 Update visitor stats"
          git pull --rebase origin main
          git push
          gh workflow run jekyll-pages.yml --ref main
