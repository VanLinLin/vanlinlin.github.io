{% if include.links %}
<div class="pub-card__links">
  {% if include.links.paper %}
  <a class="btn-pill btn-pill--paper" href="{{ include.links.paper }}" target="_blank" rel="noopener"><i class="fas fa-file-alt" aria-hidden="true"></i> Paper</a>
  {% endif %}
  {% if include.links.arxiv %}
  <a class="btn-pill btn-pill--arxiv" href="{{ include.links.arxiv }}" target="_blank" rel="noopener"><i class="ai ai-arxiv" aria-hidden="true"></i> arXiv</a>
  {% endif %}
  {% if include.links.project %}
  <a class="btn-pill btn-pill--project" href="{{ include.links.project }}" target="_blank" rel="noopener"><i class="fas fa-globe" aria-hidden="true"></i> Project Page</a>
  {% endif %}
  {% if include.links.code %}
  <a class="btn-pill btn-pill--code" href="{{ include.links.code }}" target="_blank" rel="noopener"><i class="fab fa-github" aria-hidden="true"></i> Code</a>
  {% endif %}
</div>
{% endif %}
