# ============================================================
# Selected Publications
# ------------------------------------------------------------
# 新增一篇論文 = 複製一段條目貼到「最上面」(新的放前面) 並改內容。
#
# 欄位說明:
#   title:    論文標題 (可用 <sup>3</sup> 等 HTML)
#   badge:    左上角的徽章文字 (例: CVPR26, ACMMM 2025, Submitted to XXX)
#   media:    圖片或影片路徑;.mp4 結尾會自動變成靜音循環自動播放的影片
#   authors:  作者列表 (Markdown;自己用 **Yu-Fan Lin**,別人可加連結)
#   venue:    (選填) 顯示在標題下的會議/期刊全名
#   keywords: 關鍵字清單
#   topics:   主題 id 清單（見 _data/topics.yml），決定篩選鈕
#   selected: true → 放進上方 Selected 大卡；其他只在 All Publications 清單
#   summary:  一句話（問題→做法→結果），顯示在卡片上
#   links:    有哪個就填哪個,沒有就整個省略
#     paper:   正式出版連結 (CVF / IEEE Xplore / ACM DL)
#     arxiv:   arXiv 連結
#     project: Project Page 連結
#     code:    GitHub Code 連結
# ============================================================

